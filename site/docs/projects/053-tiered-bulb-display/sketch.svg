<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf3f8"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <pattern id="slats" width="14" height="40" patternUnits="userSpaceOnUse">
      <rect width="14" height="40" fill="#2c5878"/>
      <line x1="13" y1="0" x2="13" y2="40" stroke="#1e3f55" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#3b6f8f" stroke-width="0.5"/>
    </pattern>
    <pattern id="slatsSide" width="14" height="40" patternUnits="userSpaceOnUse">
      <rect width="14" height="40" fill="#234c68"/>
      <line x1="13" y1="0" x2="13" y2="40" stroke="#142e44" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="flowerY" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff3a0"/>
      <stop offset="100%" stop-color="#e6a800"/>
    </radialGradient>
    <radialGradient id="flowerR" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff9aa2"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
    <radialGradient id="flowerP" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8b8e0"/>
      <stop offset="100%" stop-color="#7d3c98"/>
    </radialGradient>
    <radialGradient id="flowerG" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a8d5a0"/>
      <stop offset="100%" stop-color="#3d7a3d"/>
    </radialGradient>
    <linearGradient id="potBlack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#sky)"/>

  <!-- Ground (loose stone) -->
  <rect x="0" y="510" width="900" height="90" fill="#c9c2b4"/>
  <line x1="0" y1="510" x2="900" y2="510" stroke="#8a8273" stroke-width="1"/>
  <g fill="#9a9286" opacity="0.6">
    <circle cx="40" cy="530" r="2"/><circle cx="90" cy="545" r="2.5"/><circle cx="130" cy="525" r="1.8"/>
    <circle cx="180" cy="540" r="2"/><circle cx="240" cy="535" r="2.2"/><circle cx="290" cy="555" r="1.5"/>
    <circle cx="340" cy="530" r="2"/><circle cx="400" cy="548" r="2.3"/><circle cx="460" cy="535" r="1.8"/>
    <circle cx="520" cy="560" r="2"/><circle cx="580" cy="530" r="2.2"/><circle cx="640" cy="545" r="1.7"/>
    <circle cx="700" cy="535" r="2.1"/><circle cx="760" cy="555" r="2"/><circle cx="820" cy="530" r="1.9"/>
  </g>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1e3f55">Tiered seasonal display from rescued plastic pots — concept sketch</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#5a6770">One continuous slatted frame in village blue, stepped on the front, mixed-size pots hidden inside on risers</text>

  <!-- ============================== -->
  <!-- Main 3/4 perspective (LEFT)    -->
  <!-- ============================== -->
  <g transform="translate(40, 90)">

    <!-- Single continuous structure: shared back wall + corner posts + stepped slatted front -->

    <!-- BACK WALL (shared, full height) -->
    <!-- Side face going back-right (perspective) -->
    <polygon points="430,360 450,340 450,80 430,100" fill="#142e44"/>
    <line x1="430" y1="360" x2="450" y2="340" stroke="#0a1d2a" stroke-width="1"/>
    <line x1="430" y1="100" x2="450" y2="80" stroke="#0a1d2a" stroke-width="1"/>

    <!-- Back panel slats (visible above each step) -->
    <!-- Above top tier: nothing (the top tier IS the back here) -->

    <!-- ===== BOTTOM TIER (largest, full width) ===== -->
    <!-- top surface (where pots sit) -->
    <polygon points="40,260 430,260 450,240 60,240" fill="#1a3245"/>
    <!-- inner shadow showing pots are recessed -->
    <rect x="48" y="244" width="378" height="14" fill="#0a1d2a" opacity="0.7"/>

    <!-- front slatted face -->
    <rect x="40" y="260" width="390" height="100" fill="url(#slats)"/>
    <!-- top rail -->
    <rect x="38" y="258" width="394" height="5" fill="#0f2333"/>
    <!-- bottom rail -->
    <rect x="38" y="358" width="394" height="6" fill="#0f2333"/>
    <!-- corner posts (visible vertical posts at corners) -->
    <rect x="38" y="258" width="6" height="106" fill="#0a1d2a"/>
    <rect x="426" y="258" width="6" height="106" fill="#0a1d2a"/>
    <!-- side slatted face (right) -->
    <polygon points="430,260 450,240 450,340 430,360" fill="url(#slatsSide)"/>
    <line x1="430" y1="260" x2="450" y2="240" stroke="#0f2333" stroke-width="1.5"/>
    <line x1="430" y1="360" x2="450" y2="340" stroke="#0f2333" stroke-width="1.5"/>

    <!-- bottom tier plants (visible above the rim - mixed) -->
    <!-- rosemary shrub -->
    <ellipse cx="80" cy="220" rx="22" ry="22" fill="url(#flowerG)"/>
    <ellipse cx="72" cy="214" rx="10" ry="9" fill="#5a9a55" opacity="0.6"/>
    <ellipse cx="88" cy="228" rx="10" ry="9" fill="#5a9a55" opacity="0.6"/>
    <!-- bulb cluster -->
    <g stroke="#2d6a3e" stroke-width="2" fill="none">
      <line x1="138" y1="240" x2="135" y2="206"/>
      <line x1="148" y1="240" x2="146" y2="198"/>
      <line x1="158" y1="240" x2="161" y2="202"/>
      <line x1="170" y1="240" x2="167" y2="196"/>
      <line x1="180" y1="240" x2="183" y2="208"/>
    </g>
    <ellipse cx="135" cy="204" rx="7" ry="9" fill="url(#flowerP)"/>
    <ellipse cx="146" cy="196" rx="8" ry="10" fill="url(#flowerR)"/>
    <ellipse cx="161" cy="200" rx="7" ry="9" fill="url(#flowerP)"/>
    <ellipse cx="167" cy="194" rx="8" ry="10" fill="url(#flowerR)"/>
    <ellipse cx="183" cy="206" rx="7" ry="9" fill="url(#flowerP)"/>
    <!-- dwarf evergreen -->
    <polygon points="232,180 213,240 251,240" fill="#3d7a3d"/>
    <polygon points="232,190 219,234 245,234" fill="#4d8a4d" opacity="0.6"/>
    <!-- hydrangea -->
    <ellipse cx="305" cy="208" rx="26" ry="22" fill="url(#flowerG)"/>
    <circle cx="294" cy="202" r="7" fill="url(#flowerP)" opacity="0.85"/>
    <circle cx="311" cy="198" r="7" fill="url(#flowerP)" opacity="0.85"/>
    <circle cx="318" cy="212" r="7" fill="url(#flowerP)" opacity="0.85"/>
    <circle cx="296" cy="218" r="7" fill="url(#flowerP)" opacity="0.85"/>
    <!-- bay -->
    <ellipse cx="380" cy="218" rx="16" ry="20" fill="url(#flowerG)"/>
    <ellipse cx="376" cy="212" rx="7" ry="6" fill="#5a9a55" opacity="0.6"/>
    <ellipse cx="386" cy="224" rx="7" ry="6" fill="#5a9a55" opacity="0.6"/>

    <!-- ===== MIDDLE TIER (stepped back from bottom) ===== -->
    <polygon points="80,170 410,170 430,150 100,150" fill="#1a3245"/>
    <rect x="88" y="154" width="318" height="12" fill="#0a1d2a" opacity="0.7"/>
    <rect x="80" y="170" width="330" height="74" fill="url(#slats)"/>
    <rect x="78" y="168" width="334" height="5" fill="#0f2333"/>
    <rect x="78" y="244" width="334" height="5" fill="#0f2333"/>
    <!-- corner posts for middle tier sides -->
    <rect x="78" y="168" width="5" height="80" fill="#0a1d2a"/>
    <rect x="407" y="168" width="5" height="80" fill="#0a1d2a"/>
    <!-- side face -->
    <polygon points="410,170 430,150 430,228 410,248" fill="url(#slatsSide)"/>
    <line x1="410" y1="170" x2="430" y2="150" stroke="#0f2333" stroke-width="1.5"/>

    <!-- middle tier plants -->
    <g stroke="#2d6a3e" stroke-width="2" fill="none">
      <line x1="118" y1="150" x2="116" y2="118"/>
      <line x1="155" y1="150" x2="151" y2="114"/>
      <line x1="160" y1="150" x2="164" y2="118"/>
      <line x1="200" y1="150" x2="198" y2="116"/>
      <line x1="240" y1="150" x2="242" y2="120"/>
      <line x1="285" y1="150" x2="282" y2="116"/>
      <line x1="290" y1="150" x2="294" y2="120"/>
      <line x1="335" y1="150" x2="333" y2="114"/>
      <line x1="378" y1="150" x2="380" y2="118"/>
    </g>
    <circle cx="116" cy="116" r="9" fill="url(#flowerY)"/>
    <circle cx="151" cy="112" r="9" fill="url(#flowerY)"/>
    <circle cx="164" cy="116" r="8" fill="url(#flowerY)"/>
    <circle cx="198" cy="114" r="9" fill="url(#flowerY)"/>
    <ellipse cx="242" cy="118" rx="11" ry="13" fill="url(#flowerG)"/>
    <circle cx="282" cy="114" r="9" fill="url(#flowerY)"/>
    <circle cx="294" cy="118" r="8" fill="url(#flowerY)"/>
    <circle cx="333" cy="112" r="9" fill="url(#flowerY)"/>
    <ellipse cx="380" cy="116" rx="10" ry="12" fill="url(#flowerG)"/>

    <!-- ===== TOP TIER (smallest, stepped back furthest) ===== -->
    <polygon points="120,80 380,80 400,60 140,60" fill="#1a3245"/>
    <rect x="128" y="64" width="248" height="12" fill="#0a1d2a" opacity="0.7"/>
    <rect x="120" y="80" width="260" height="60" fill="url(#slats)"/>
    <rect x="118" y="78" width="264" height="5" fill="#0f2333"/>
    <rect x="118" y="140" width="264" height="5" fill="#0f2333"/>
    <rect x="118" y="78" width="5" height="66" fill="#0a1d2a"/>
    <rect x="377" y="78" width="5" height="66" fill="#0a1d2a"/>
    <polygon points="380,80 400,60 400,124 380,144" fill="url(#slatsSide)"/>
    <line x1="380" y1="80" x2="400" y2="60" stroke="#0f2333" stroke-width="1.5"/>

    <!-- top tier flowers (red tulips/crocus) -->
    <g stroke="#2d6a3e" stroke-width="2" fill="none">
      <line x1="150" y1="60" x2="148" y2="32"/>
      <line x1="180" y1="60" x2="182" y2="28"/>
      <line x1="210" y1="60" x2="208" y2="34"/>
      <line x1="240" y1="60" x2="244" y2="26"/>
      <line x1="270" y1="60" x2="268" y2="30"/>
      <line x1="300" y1="60" x2="302" y2="32"/>
      <line x1="330" y1="60" x2="328" y2="28"/>
      <line x1="360" y1="60" x2="362" y2="32"/>
    </g>
    <ellipse cx="148" cy="30" rx="7" ry="9" fill="url(#flowerR)"/>
    <ellipse cx="182" cy="26" rx="7" ry="9" fill="url(#flowerR)"/>
    <ellipse cx="208" cy="32" rx="7" ry="9" fill="url(#flowerR)"/>
    <ellipse cx="244" cy="24" rx="8" ry="10" fill="url(#flowerR)"/>
    <ellipse cx="268" cy="28" rx="7" ry="9" fill="url(#flowerR)"/>
    <ellipse cx="302" cy="30" rx="7" ry="9" fill="url(#flowerR)"/>
    <ellipse cx="328" cy="26" rx="7" ry="9" fill="url(#flowerR)"/>
    <ellipse cx="362" cy="30" rx="7" ry="9" fill="url(#flowerR)"/>

    <!-- Concrete paver base (weighted) -->
    <rect x="36" y="364" width="396" height="14" fill="#8a8d8e"/>
    <line x1="36" y1="371" x2="432" y2="371" stroke="#5d6062" stroke-width="0.8"/>

    <!-- Person silhouette for scale -->
    <g transform="translate(530, 220)" fill="#3a4045">
      <circle cx="0" cy="0" r="11"/>
      <rect x="-13" y="11" width="26" height="50" rx="6"/>
      <rect x="-13" y="61" width="11" height="48"/>
      <rect x="2" y="61" width="11" height="48"/>
      <rect x="-22" y="14" width="9" height="34" rx="3"/>
      <rect x="13" y="14" width="9" height="34" rx="3"/>
    </g>
    <text x="545" y="350" font-size="11" fill="#5a6770" text-anchor="middle">~1.7m</text>

    <!-- Height annotation -->
    <line x1="475" y1="60" x2="475" y2="378" stroke="#5a6770" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="471" y1="60" x2="479" y2="60" stroke="#5a6770" stroke-width="1"/>
    <line x1="471" y1="378" x2="479" y2="378" stroke="#5a6770" stroke-width="1"/>
    <text x="490" y="225" font-size="12" fill="#5a6770">~1.6m</text>

    <!-- Width annotation -->
    <line x1="40" y1="395" x2="430" y2="395" stroke="#5a6770" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="40" y1="391" x2="40" y2="399" stroke="#5a6770" stroke-width="1"/>
    <line x1="430" y1="391" x2="430" y2="399" stroke="#5a6770" stroke-width="1"/>
    <text x="235" y="411" font-size="12" fill="#5a6770" text-anchor="middle">~2.2m wide</text>

    <!-- Annotation: corner posts -->
    <line x1="42" y1="260" x2="-10" y2="260" stroke="#5a6770" stroke-width="0.6"/>
    <text x="-15" y="263" font-size="10" fill="#5a6770" text-anchor="end">corner post</text>
    <line x1="429" y1="260" x2="475" y2="290" stroke="#5a6770" stroke-width="0.6"/>
    <text x="478" y="293" font-size="10" fill="#5a6770">corner post</text>
  </g>

  <!-- ============================== -->
  <!-- Side cutaway (RIGHT)           -->
  <!-- ============================== -->
  <g transform="translate(640, 100)">
    <text x="110" y="0" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3f55">Side view (cutaway)</text>
    <text x="110" y="16" text-anchor="middle" font-size="10" fill="#5a6770" font-style="italic">how mixed pots fit inside on risers</text>

    <!-- ground -->
    <line x1="0" y1="380" x2="220" y2="380" stroke="#8a8273" stroke-width="1"/>

    <!-- back wall (full height continuous) -->
    <rect x="190" y="60" width="14" height="320" fill="#1e3f55"/>
    <line x1="190" y1="60" x2="190" y2="380" stroke="#0f2333" stroke-width="1"/>

    <!-- bottom tier outline + slats -->
    <rect x="20" y="240" width="170" height="120" fill="none" stroke="#0f2333" stroke-width="1.5"/>
    <line x1="20" y1="240" x2="190" y2="240" stroke="#0f2333" stroke-width="2"/>
    <!-- front slats indicator -->
    <line x1="20" y1="240" x2="20" y2="360" stroke="#1e3f55" stroke-width="3"/>
    <!-- bottom rail -->
    <line x1="20" y1="360" x2="190" y2="360" stroke="#0f2333" stroke-width="2"/>

    <!-- middle tier (steps in from front) -->
    <rect x="50" y="160" width="140" height="80" fill="none" stroke="#0f2333" stroke-width="1.5"/>
    <line x1="50" y1="160" x2="190" y2="160" stroke="#0f2333" stroke-width="2"/>
    <line x1="50" y1="160" x2="50" y2="240" stroke="#1e3f55" stroke-width="3"/>

    <!-- top tier -->
    <rect x="80" y="90" width="110" height="70" fill="none" stroke="#0f2333" stroke-width="1.5"/>
    <line x1="80" y1="90" x2="190" y2="90" stroke="#0f2333" stroke-width="2"/>
    <line x1="80" y1="90" x2="80" y2="160" stroke="#1e3f55" stroke-width="3"/>

    <!-- INSIDE: pots on risers -->
    <!-- bottom tier: a 20L pot (no riser needed, fills the space) and a smaller one on a riser -->
    <!-- 20L pot -->
    <path d="M 35 252 L 42 358 L 92 358 L 99 252 Z" fill="url(#potBlack)" opacity="0.85"/>
    <line x1="35" y1="252" x2="99" y2="252" stroke="#0a0a0a" stroke-width="1.5"/>
    <!-- 10L pot on a brick riser -->
    <rect x="115" y="320" width="60" height="38" fill="#a86b3d" stroke="#7a4a25" stroke-width="0.8"/>
    <line x1="115" y1="335" x2="175" y2="335" stroke="#7a4a25" stroke-width="0.5"/>
    <text x="145" y="343" font-size="8" fill="#fff" text-anchor="middle" opacity="0.7">riser</text>
    <path d="M 117 252 L 122 320 L 168 320 L 173 252 Z" fill="url(#potBlack)" opacity="0.85"/>
    <line x1="117" y1="252" x2="173" y2="252" stroke="#0a0a0a" stroke-width="1.5"/>

    <!-- middle tier: 5L pot on small riser, 5L direct -->
    <rect x="62" y="220" width="50" height="20" fill="#a86b3d" stroke="#7a4a25" stroke-width="0.8"/>
    <path d="M 65 172 L 70 220 L 104 220 L 109 172 Z" fill="url(#potBlack)" opacity="0.85"/>
    <line x1="65" y1="172" x2="109" y2="172" stroke="#0a0a0a" stroke-width="1.5"/>
    <path d="M 122 172 L 127 240 L 173 240 L 178 172 Z" fill="url(#potBlack)" opacity="0.85"/>
    <line x1="122" y1="172" x2="178" y2="172" stroke="#0a0a0a" stroke-width="1.5"/>

    <!-- top tier: 1L pot on tall riser (so rim aligns), 3L direct -->
    <rect x="92" y="138" width="30" height="22" fill="#a86b3d" stroke="#7a4a25" stroke-width="0.8"/>
    <line x1="92" y1="148" x2="122" y2="148" stroke="#7a4a25" stroke-width="0.5"/>
    <path d="M 95 102 L 99 138 L 117 138 L 121 102 Z" fill="url(#potBlack)" opacity="0.85"/>
    <line x1="95" y1="102" x2="121" y2="102" stroke="#0a0a0a" stroke-width="1.5"/>
    <path d="M 132 102 L 137 160 L 175 160 L 180 102 Z" fill="url(#potBlack)" opacity="0.85"/>
    <line x1="132" y1="102" x2="180" y2="102" stroke="#0a0a0a" stroke-width="1.5"/>

    <!-- plants poking out the top of each tier -->
    <line x1="70" y1="252" x2="68" y2="222" stroke="#2d6a3e" stroke-width="2"/>
    <ellipse cx="68" cy="220" rx="7" ry="9" fill="url(#flowerR)"/>
    <line x1="148" y1="252" x2="146" y2="226" stroke="#2d6a3e" stroke-width="2"/>
    <ellipse cx="146" cy="222" rx="9" ry="11" fill="url(#flowerG)"/>
    <line x1="86" y1="172" x2="83" y2="146" stroke="#2d6a3e" stroke-width="2"/>
    <circle cx="83" cy="144" r="8" fill="url(#flowerY)"/>
    <line x1="150" y1="172" x2="152" y2="146" stroke="#2d6a3e" stroke-width="2"/>
    <circle cx="152" cy="144" r="8" fill="url(#flowerY)"/>
    <line x1="108" y1="102" x2="106" y2="80" stroke="#2d6a3e" stroke-width="2"/>
    <ellipse cx="106" cy="78" rx="6" ry="8" fill="url(#flowerR)"/>
    <line x1="155" y1="102" x2="158" y2="80" stroke="#2d6a3e" stroke-width="2"/>
    <ellipse cx="158" cy="78" rx="6" ry="8" fill="url(#flowerR)"/>

    <!-- weighted base -->
    <rect x="15" y="380" width="180" height="6" fill="#8a8d8e"/>
    <text x="105" y="402" font-size="10" fill="#5a6770" text-anchor="middle">weighted base on loose stone</text>

    <!-- callouts -->
    <line x1="190" y1="220" x2="220" y2="220" stroke="#5a6770" stroke-width="0.6"/>
    <text x="222" y="223" font-size="9" fill="#5a6770">shared back wall</text>
    <line x1="115" y1="335" x2="225" y2="365" stroke="#5a6770" stroke-width="0.6"/>
    <text x="225" y="368" font-size="9" fill="#5a6770">brick risers lift</text>
    <text x="225" y="378" font-size="9" fill="#5a6770">smaller pots</text>
    <text x="225" y="388" font-size="9" fill="#5a6770">to slat top</text>
  </g>

  <!-- Caption -->
  <text x="450" y="582" text-anchor="middle" font-size="11" fill="#5a6770" font-style="italic">
    Concept sketch only. Tier dimensions, slat spacing and exact step depths to be confirmed with the partner group (Men's Shed or school woodwork class).
  </text>
</svg>
