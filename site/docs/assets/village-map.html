        var MAP_DATA = {"markers": [{"id": "monument", "name": "Monument Area", "category": "Village Features", "color": "#2196F3", "coords": [52.67263, -7.710828], "desc": "The heart of the village. Anchored by our All-Ireland Victory Centennial monument, marking 100 years since Two Mile Borris represented Tipperary and won the 1900 All-Ireland Hurling Final at Jones' Road in Dublin (we beat London 2-5 to 0-6). The names of the winning panel are listed on the centre plaque, with the club's red-and-yellow flying alongside the Tipperary blue-and-gold. Surrounded by seasonal flower beds, the sensory garden signpost, and the Christmas tree site. Bollards to be repainted (adjudicator recommendation, repeated from 2024).", "photos": [{"src": "map-data/photos/monument/all-ireland-1900-centennial-monument.jpg", "caption": "Our All-Ireland Victory Centennial monument, marking 100 years since Two Mile Borris represented Tipperary and won the 1900 All-Ireland Hurling Final at Jones' Road in Dublin (we beat London 2-5 to 0-6). The names of that winning panel are on the centre plaque, with the club's red-and-yellow flying alongside the Tipperary blue-and-gold. A piece of GAA history that very few villages can match."}, {"src": "map-data/photos/monument/monument-wall-flowers-may-2026.jpg", "caption": "The All-Ireland Victory Centennial monument surrounded by colourful Poppies, Salvia, Lamb's Ear and Hebe (May 2026)"}, {"src": "map-data/photos/monument/flower-bed-portrait-may-2026.jpg", "caption": "The main flower bed at the village centre absolutely packed with colour! Red Poppies, pink Phlox, yellow Wallflowers, purple Salvia, blue Lobelia and clipped Box and Hebe shrubs. A fantastic display of year-round structure with gorgeous seasonal colour right at the heart of Two-Mile-Borris (May 2026)"}, {"src": "map-data/photos/monument/community-garden-sign-may-2026.jpg", "caption": "Arabis, Heuchera and Hebe looking well at the Community Garden sign (May 2026)"}, {"src": "map-data/photos/monument/community-garden-sign-summer-2025.jpg", "caption": "Hebes, Foxgloves, Anemone and Catmint looking lovely at the Monk (June 2025)"}, {"src": "map-data/photos/monument/flower-bed-wide-may-2026.jpg", "caption": "Fantastic display of Poppies, Lamb's Ear, Salvia, Wallflowers, Phlox and Hebe in the main flower bed (May 2026)"}, {"src": "map-data/photos/monument/wildflower-strip-main-road-may-2026.jpg", "caption": "Volunteer-maintained Alliums and naturalised wildflowers along the main road heading west, just before you reach the monument area. A lovely soft welcome into the heart of the village (May 2026)"}, {"src": "map-data/photos/monument/christmas-lights-tractor-parade-dec-2023.jpg", "caption": "Our Christmas lights switch-on parade, with decorated tractors rolling down the main street under the lit-up canopy. The whole village turns out for this every year, and between the singers, the pipers, the mulled wine and Santa coming in on the lead tractor it's a brilliant night (December 2023)"}]}, {"id": "forge", "name": "The Old Forge", "category": "Village Features", "color": "#2196F3", "coords": [52.672723, -7.711571], "desc": "Restored forge beside Corcoran's Bar parking. Heritage feature on the main street.", "photos": [{"src": "map-data/photos/forge/forge-front-may-2026.jpg", "caption": "The Old Forge in the heart of the village, with its iconic star above the archway, ivy clambering up the gable and the ornate cast-iron bench out front. A real heritage gem (May 2026)"}]}, {"id": "blackcastle", "name": "Blackcastle (Norman Castle)", "category": "Village Features", "color": "#2196F3", "coords": [52.672048, -7.715111], "desc": "Historic Norman castle remains on the western approach to the village.", "photos": [{"src": "map-data/photos/blackcastle/castle-streetview-summer.jpg", "caption": "The Blackcastle, our 12th-century Norman tower house keeping watch over the western end of the village. The lovely red-trim cottage out front gives a great sense of just how big the keep really is, and on a sunny day with the trees in leaf this is one of the best views in TMB"}, {"src": "map-data/photos/blackcastle/castle-keep-closeup-summer.jpg", "caption": "A closer look at the keep itself. You can see all four storeys of the Norman tower house, the corner turret, and the gorgeous medieval stonework that has been standing on the western edge of the village for nearly a thousand years."}]}, {"id": "liathmore", "name": "Liathmore Monastic Site", "category": "Village Features", "color": "#2196F3", "coords": [52.67055, -7.66861], "desc": "Seventh-century monastic site about 2.8km east of the village, founded by St Mochoemog, the same saint our village school Scoil Mochaomhóg Naofa NS is named after. Two ruined churches and the foundation of an ancient round tower are still visible at the site, and the larger 12th-century church has a Romanesque doorway and a sheela-na-gig carving.", "photos": [{"src": "map-data/photos/liathmore/round-tower-foundation.jpg", "caption": "The foundation circle of the round tower at Liathmore, with one of the two ruined churches in the background. Saint Mochoemog founded a monastery here in the 7th century and gave his name to our village school."}, {"src": "map-data/photos/liathmore/sheela-na-gig.png", "caption": "The Liathmore sheela-na-gig, a small medieval carved figure tucked into the doorway of the larger church. Heavy lichen and centuries of Tipperary weather have softened the stone, but the carving is still there for those who know to look."}, {"src": "map-data/photos/liathmore/romanesque-carving-detail.png", "caption": "A detail of the medieval stonework inside the larger 12th-century church at Liathmore. The carved decoration on the doorway has been quietly weathering since long before our village was here."}]}, {"id": "bannons", "name": "Bannon's Bar Lounge", "category": "Businesses", "color": "#FF9800", "coords": [52.67279, -7.712638], "desc": "Pub on the main street (L4202).", "photos": []}, {"id": "tullys", "name": "Tully's Nearby", "category": "Businesses", "color": "#FF9800", "coords": [52.672533, -7.711742], "desc": "Pub and shop on the main street.", "photos": []}, {"id": "corcorans", "name": "Corcoran's Bar & Shop", "category": "Businesses", "color": "#FF9800", "coords": [52.672635, -7.711244], "desc": "Bar with separate shop entrance on the right-hand side.", "photos": [{"src": "map-data/photos/corcorans/corcorans-storefront-winter.jpg", "caption": "Corcoran's Bar and Shop on the main street on a bright winter day. The bar entrance sits in the middle of the building, with the separate shop entrance just to the right. You can see St James Church at the far end of the row."}, {"src": "map-data/photos/corcorans/planter-may-2026.jpg", "caption": "One of our older concrete planters in front of Corcoran's. Going forward we're filling these with split perennials from our other beds, instead of buying annuals every year. No waste, no spend, and a much better deal for our pollinators (May 2026)"}]}, {"id": "sensory_garden", "name": "Sensory Garden", "category": "Green Spaces & Nature", "color": "#4CAF50", "coords": [52.673274, -7.71068], "desc": "Located beside Scoil Mochaomhóg Naofa NS (left side). Timber pathways and sensory planting. Maintenance of paths recommended by adjudicator.", "photos": [{"src": "map-data/photos/sensory_garden/pergola-may-2026.jpg", "caption": "Our timber pergola in the sensory garden, all locally sourced wood with a sunny yellow plinth and gravel paths underfoot. Hawthorn and willow plantings give shade and scent for the children on the school side (May 2026)"}, {"src": "map-data/photos/sensory_garden/amphitheatre-may-2026.jpg", "caption": "The drystone amphitheatre in the sensory garden, with hazel and willow filling out behind. A great little outdoor classroom for the school (May 2026)"}, {"src": "map-data/photos/sensory_garden/carved-sculpture-may-2026.jpg", "caption": "A carved wooden sculpture in the sensory garden, made from a recycled tree stump and tucked in among the willows. A real talking point for the kids (May 2026)"}, {"src": "map-data/photos/sensory_garden/willow-weaving-spring-2026.jpg", "caption": "Volunteer building a living willow dome in the sensory garden. Once these rods root and leaf out they'll create a brilliant natural play and shelter feature, and the early catkins are great for bees too (March 2026)"}, {"src": "map-data/photos/sensory_garden/timber-gateway-spring-2026.jpg", "caption": "Work underway on the sensory garden timber gateway and entrance, weaving living willow rods into the boundary planting alongside natural stone and reclaimed timber. All sustainable materials creating a lovely outdoor classroom space right beside the school (March 2026)"}, {"src": "map-data/photos/sensory_garden/volunteer-wooden-throne-april-2026.jpg", "caption": "One of our youngest volunteers taking a well-earned break on the sensory garden's wooden throne after a hard day's work (April 2026)"}, {"src": "map-data/photos/sensory_garden/sensory-garden-aerial-spring.jpg", "caption": "A cracking drone view of the sensory garden in full spring bloom. You can pick out the timber pergola, the drystone amphitheatre, the gravel paths winding through, and the Cherry blossom going mad on either side. The school is just out of frame to the right and you can see how nicely the whole space sits within the village (Spring 2025)"}]}, {"id": "church", "name": "St James Church & Grounds", "category": "Green Spaces & Nature", "color": "#4CAF50", "coords": [52.672921, -7.711968], "desc": "Church across from Tully's on the main street. Potential site for wildflower bed to increase species diversity (adjudicator recommendation).", "photos": [{"src": "map-data/photos/church/church-front-may-2026.jpg", "caption": "Saint James Church on the main street, bell-cote standing proud above the three lancet windows. A lovely calm centrepiece in the heart of the village (May 2026)"}, {"src": "map-data/photos/church/guttering-may-2026.jpg", "caption": "The corner of the church and the cast-iron downpipe we're hoping to feed into a water butt. Conversation underway with Father Tom about adding rainwater harvesting (May 2026)"}, {"src": "map-data/photos/church/bug-hotel-close-may-2026.jpg", "caption": "Our bug hotel in the church grounds, mounted on a recycled tree stump and packed with pine cones, bamboo, drilled timber and reeds. Five-star accommodation for solitary bees, ladybirds and lacewings (May 2026)"}, {"src": "map-data/photos/church/church-deep-clean-dec-2023.jpg", "caption": "The big deep clean of Saint James Church back in late 2023, with a Genie cherry-picker reaching right up to the bell-cote and gable. You can see the contrast between the freshly cleaned section and the older grime above the windows. Father Tom organised the works and we were delighted to chip in (December 2023)"}]}, {"id": "cemetery", "name": "Two-Mile-Borris Cemetery", "category": "Green Spaces & Nature", "color": "#4CAF50", "coords": [52.671526, -7.713888], "desc": "Including graveyard extension. Opportunity for biodiversity-rich landscaping scheme. Consult local biodiversity officer at Tipperary County Council (adjudicator recommendation).", "photos": [{"src": "map-data/photos/cemetery/old-gate-may-2026.jpg", "caption": "The original gates to Two-Mile-Borris cemetery, with their lovely carved stone urn finials and wrought iron, framed by the old Cypress on the right (May 2026)"}, {"src": "map-data/photos/cemetery/parking-with-planters-may-2026.jpg", "caption": "The parking layby in front of the cemetery, with our two blue planters either side framing the spot. The Norman Blackcastle ruin is visible just beyond on the right, marking the western edge of the village (May 2026)"}, {"src": "map-data/photos/cemetery/blue-planter-may-2026.jpg", "caption": "One of our two blue trough planters at the cemetery layby. Locally sourced wood, made by a local tradesman, part of the cohesive village-wide planter scheme we're rolling out (May 2026)"}]}, {"id": "new_cemetery_entrance", "name": "New Cemetery Entrance", "category": "Green Spaces & Nature", "color": "#4CAF50", "coords": [52.6726, -7.7133], "desc": "New entrance to the enlarged cemetery on the L4202.", "photos": [{"src": "map-data/photos/new_cemetery_entrance/entrance-may-2026.jpg", "caption": "The new entrance to the enlarged cemetery on the L4202, with its lovely stone pillars, dedication plaque and gravel sweep (May 2026)"}, {"src": "map-data/photos/new_cemetery_entrance/entrance-through-may-2026.jpg", "caption": "Looking through the new cemetery gates to the burial ground beyond (May 2026)"}, {"src": "map-data/photos/new_cemetery_entrance/graveyard-extension-construction-spring-2025.jpg", "caption": "Construction of the graveyard extension well underway in early 2025. You can see the info board on the left with the layout drawing and the digger getting stuck into the new ground. A big project for the village and great to see it coming together (Spring 2025)"}]}, {"id": "old_road_triangle", "name": "Old Road Triangle (N75 Diversion)", "category": "Green Spaces & Nature", "color": "#4CAF50", "coords": [52.6713, -7.7155], "desc": "Wedge of mature trees and rough ground left between the old and new road alignments after the N75 was rerouted around the village in 2010, when the M8 motorway opened at Junction 5. Used to be the through-road for centuries, then overnight became an island between the new junction and the village edge. Nobody has touched it since, and it has quietly turned into a proper little wildlife refuge of mature trees and undergrowth. We deliberately leave it alone, no mowing, no tidying, no lifting of fallen wood, and let it do its own thing. Birds we regularly see and hear in there include Wren, Blackcap, Chiffchaff, Robin, Chaffinch, Blue Tit, House Sparrow, Goldcrest, Goldfinch and Blackbird, a list that says everything about the habitat quality, with summer-migrant warblers and Ireland's smallest bird (the Goldcrest) all settled in.", "photos": []}, {"id": "school", "name": "Scoil Mochaomhóg Naofa NS", "category": "School", "color": "#9C27B0", "coords": [52.67297, -7.710477], "desc": "National school. Green Schools programme; elaborate on connection in application (adjudicator recommendation).", "photos": []}, {"id": "castle_park", "name": "Castle Park", "category": "Housing Estates", "color": "#00838F", "coords": [52.674313, -7.711089], "desc": "Housing estate north of the main street.", "photos": []}, {"id": "ned_hayes", "name": "Ned Hayes Park", "category": "Housing Estates", "color": "#00838F", "coords": [52.673562, -7.710847], "desc": "Develop bedding in green strips, add climbers on boundary walls (adjudicator recommendation).", "photos": []}, {"id": "glen_carraig", "name": "Glen Carraig", "category": "Housing Estates", "color": "#00838F", "coords": [52.672014, -7.705495], "desc": "Eastern estate. Develop wildflower garden at extensive entrance green area (adjudicator recommendation).", "photos": [{"src": "map-data/photos/glen_carraig/crocuses-roadside-spring-2026.jpg", "caption": "Crocuses and Daffodils putting on a beautiful show outside Glen Carraig (March 2026)"}, {"src": "map-data/photos/glen_carraig/crocus-honeybee-closeup-spring-2026.jpg", "caption": "Honeybee busy foraging on a Crocus outside Glen Carraig. Great to see the early pollinators out and about! (March 2026)"}, {"src": "map-data/photos/glen_carraig/daffodils-stone-wall-spring-2026.jpg", "caption": "Cheerful Daffodils planted along the limestone wall at Glen Carraig (March 2026)"}, {"src": "map-data/photos/glen_carraig/alliums-stone-wall-may-2026.jpg", "caption": "Stunning Allium Purple Sensation in bloom along Glen Carraig's limestone wall (May 2026)"}, {"src": "map-data/photos/glen_carraig/crocuses-lowangle-spring-2026.jpg", "caption": "Ground-level view of Crocuses in full bloom along the verge at Glen Carraig, with the village stretching into the background. Brillian         var map = L.map('map').setView([52.6726, -7.7080], 16);

        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Imagery &copy; Esri', maxZoom: 19
        });
        var labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        });
        var streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
        });

        satellite.addTo(map);
        labels.addTo(map);
        L.control.layers({
            "Satellite": L.layerGroup([satellite, labels]),
            "Street Map": streets
        }, null, { position: 'topleft' }).addTo(map);

        // Rendering
        var photosByName = {};
        var carouselPhotos = [];
        var carouselIndex = 0;
        var carouselTitle = '';

        // Bog walk trail — dual polyline (glow + main) with popup
        var bogGlow, bogPath, bogMidpoint;
        var bogWalk = MAP_DATA.bogWalk;
        if (bogWalk && bogWalk.path && bogWalk.path.length > 1) {
            bogGlow = L.polyline(bogWalk.path, {
                color: '#E65100', weight: 10, opacity: 0.2,
                interactive: false
            }).addTo(map);

            bogPath = L.polyline(bogWalk.path, {
                color: '#E65100', weight: 4, opacity: 0.85,
                dashArray: '10 6', lineCap: 'round', lineJoin: 'round'
            }).addTo(map);

            bogPath.on('mouseover', function() {
                this.setStyle({ weight: 6 });
                this.getElement().style.cursor = 'pointer';
            });
            bogPath.on('mouseout', function() {
                this.setStyle({ weight: 4 });
            });

            var midIdx = Math.floor(bogWalk.path.length / 2);
            bogMidpoint = bogWalk.path[midIdx];

            photosByName[bogWalk.name] = bogWalk.photos || [];

            var bogMarkerData = {
                name: bogWalk.name,
                category: bogWalk.category,
                color: '#E65100',
                desc: bogWalk.description,
                distance: bogWalk.distance,
                photos: bogWalk.photos || []
            };
            bogPath.bindPopup(buildPopup(bogMarkerData), { maxWidth: 320, minWidth: 280 });
        }

        function gmapsUrl(lat, lng) {
            return "https://www.google.com/maps/@" + lat + "," + lng + ",18z/data=!3m1!1e3";
        }

        function esc(str) {
            return str.replace(/'/g, "\\'").replace(/&/g, "&amp;");
        }

        function buildPopup(m) {
            var p = m.photos || [];
            var heroImg = '';
            var heroCaption = '';
            if (p.length > 0) {
                heroImg = '<img class="popup-img" src="' + p[0].src + '" alt="' + esc(m.name) + '" onclick="openCarousel(\'' + esc(m.name) + '\', 0)" />';
                heroCaption = '<div class="popup-caption">' + p[0].caption + '</div>';
            }

            var gallery = '';
            if (p.length > 1) {
                var MAX_THUMBS = 4;
                var visible = Math.min(p.length, MAX_THUMBS);
                gallery = '<div class="popup-gallery">';
                for (var i = 0; i < visible; i++) {
                    var photo = p[i];
                    var hasMore = (i === visible - 1) && (p.length > MAX_THUMBS);
                    var overlay = hasMore ? '<div class="gallery-more">+' + (p.length - MAX_THUMBS) + '</div>' : '';
                    gallery += '<div class="gallery-item" title="' + photo.caption + '" onclick="openCarousel(\'' + esc(m.name) + '\', ' + i + ')">' +
                               '<img src="' + photo.src + '" alt="' + photo.caption + '" />' +
                               overlay +
                               '</div>';
                }
                gallery += '</div>';
            }

            return '<div class="popup-card">' +
                heroImg +
                '<div class="popup-body">' +
                    heroCaption +
                    '<h3>' + m.name + '</h3>' +
                    '<span class="popup-cat" style="background:' + m.color + '">' + m.category + '</span>' +
                    (m.distance ? '<p style="margin:0 0 8px 0;font-size:13px;color:#E65100;font-weight:600;">' + m.distance + '</p>' : '') +
                    '<p>' + m.desc + '</p>' +
                    gallery +
                    (m.coords ? '<div class="popup-links">' +
                        '<a class="gmaps-link" href="' + gmapsUrl(m.coords[0], m.coords[1]) + '" target="_blank">' +
                            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
                            'View on Google Maps' +
                        '</a>' +
                    '</div>' : '') +
                '</div>' +
            '</div>';
        }

        function createIcon(color) {
            return L.divIcon({
                className: 'custom-marker',
                html: '<svg width="28" height="42" viewBox="0 0 24 36"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z" fill="' + color + '" stroke="white" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="white"/></svg>',
                iconSize: [28, 42],
                iconAnchor: [14, 42],
                popupAnchor: [0, -42]
            });
        }

        var categoryLayers = {};

        MAP_DATA.markers.forEach(function(m) {
            photosByName[m.name] = m.photos || [];
            var popup = buildPopup(m);
            var marker = L.marker(m.coords, { icon: createIcon(m.color) });
            marker.bindPopup(popup, { maxWidth: 320, minWidth: 280 });
            marker.bindTooltip(m.name, { permanent: false, direction: 'top', offset: [0, -42] });

            if (!categoryLayers[m.category]) {
                categoryLayers[m.category] = L.layerGroup().addTo(map);
            }
            categoryLayers[m.category].addLayer(marker);
        });

        // Carousel
        function openCarousel(name, index) {
            if (event) event.stopPropagation();
            carouselPhotos = photosByName[name] || [];
            carouselIndex = index || 0;
            carouselTitle = name;
            if (carouselPhotos.length === 0) return;
            updateCarousel();
            document.getElementById('lightbox').classList.add('active');
            map.dragging.disable();
            map.keyboard.disable();
        }

        function updateCarousel() {
            var photo = carouselPhotos[carouselIndex];
            document.getElementById('lb-img').src = photo.src;
            document.getElementById('lb-caption').textContent = photo.caption;
            document.getElementById('lb-subcaption').textContent = carouselTitle;
            document.getElementById('lb-counter').textContent = (carouselIndex + 1) + ' of ' + carouselPhotos.length;
            document.querySelector('.lb-prev').style.visibility = carouselPhotos.length > 1 ? 'visible' : 'hidden';
            document.querySelector('.lb-next').style.visibility = carouselPhotos.length > 1 ? 'visible' : 'hidden';
        }

        function carouselNext(e) { e.stopPropagation(); carouselIndex = (carouselIndex + 1) % carouselPhotos.length; updateCarousel(); }
        function carouselPrev(e) { e.stopPropagation(); carouselIndex = (carouselIndex - 1 + carouselPhotos.length) % carouselPhotos.length; updateCarousel(); }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            map.dragging.enable();
            map.keyboard.enable();
        }

        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') { carouselIndex = (carouselIndex + 1) % carouselPhotos.length; updateCarousel(); }
            if (e.key === 'ArrowLeft') { carouselIndex = (carouselIndex - 1 + carouselPhotos.length) % carouselPhotos.length; updateCarousel(); }
        });

        // Legend interactivity
        document.querySelectorAll('.legend-row[data-category]').forEach(function(row) {
            row.addEventListener('click', function() {
                var cat = this.getAttribute('data-category');

                if (cat === 'Bog Walk') {
                    if (!bogPath) return;
                    if (map.hasLayer(bogPath)) {
                        map.removeLayer(bogPath);
                        if (bogGlow) map.removeLayer(bogGlow);
                        this.classList.add('dimmed');
                    } else {
                        bogGlow.addTo(map);
                        bogPath.addTo(map);
                        this.classList.remove('dimmed');
                    }
                    return;
                }

                var layer = categoryLayers[cat];
                if (!layer) return;

                if (map.hasLayer(layer)) {
                    map.removeLayer(layer);
                    this.classList.add('dimmed');
                } else {
                    layer.addTo(map);
                    this.classList.remove('dimmed');
                }
            });
        });
    </script>
