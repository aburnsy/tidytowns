                    '<h3>' + m.name + '</h3>' +
                    '<span class="popup-cat" style="background:' + m.color + '">' + m.category + '</span>' +
                    (m.distance ? '<p style="margin:0 0 8px 0;font-size:13px;color:#E65100;font-weight:600;">' + m.distance + '</p>' : '') +
                    '<p>' + m.desc + '</p>' +
                    gallery +
                    (m.coords ? '<div class="popup-links">' +
                        '<a class="gmaps-link" href="' + gmapsUrl(m.coords[0], m.coords[1]) + '" target="_blank">' +
                            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
                            'View on Google Maps' +
                        '</a>' +
                    '</div>' : '') +
                '</div>' +
            '</div>';
        }

        function createIcon(color) {
            return L.divIcon({
                className: 'custom-marker',
                html: '<svg width="28" height="42" viewBox="0 0 24 36"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z" fill="' + color + '" stroke="white" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="white"/></svg>',
                iconSize: [28, 42],
                iconAnchor: [14, 42],
                popupAnchor: [0, -42]
            });
        }

        var categoryLayers = {};

        MAP_DATA.markers.forEach(function(m) {
            photosByName[m.name] = m.photos || [];
            var popup = buildPopup(m);
            var marker = L.marker(m.coords, { icon: createIcon(m.color) });
            marker.bindPopup(popup, { maxWidth: 320, minWidth: 280 });
            marker.bindTooltip(m.name, { permanent: false, direction: 'top', offset: [0, -42] });

            if (!categoryLayers[m.category]) {
                categoryLayers[m.category] = L.layerGroup().addTo(map);
            }
            categoryLayers[m.category].addLayer(marker);
        });

        // Carousel
        function openCarousel(name, index) {
            if (event) event.stopPropagation();
            carouselPhotos = photosByName[name] || [];
            carouselIndex = index || 0;
            carouselTitle = name;
            if (carouselPhotos.length === 0) return;
            updateCarousel();
            document.getElementById('lightbox').classList.add('active');
            map.dragging.disable();
            map.keyboard.disable();
        }

        function updateCarousel() {
            var photo = carouselPhotos[carouselIndex];
            document.getElementById('lb-img').src = photo.src;
            document.getElementById('lb-caption').textContent = photo.caption;
            document.getElementById('lb-subcaption').textContent = carouselTitle;
            document.getElementById('lb-counter').textContent = (carouselIndex + 1) + ' of ' + carouselPhotos.length;
            document.querySelector('.lb-prev').style.visibility = carouselPhotos.length > 1 ? 'visible' : 'hidden';
            document.querySelector('.lb-next').style.visibility = carouselPhotos.length > 1 ? 'visible' : 'hidden';
        }

        function carouselNext(e) { e.stopPropagation(); carouselIndex = (carouselIndex + 1) % carouselPhotos.length; updateCarousel(); }
        function carouselPrev(e) { e.stopPropagation(); carouselIndex = (carouselIndex - 1 + carouselPhotos.length) % carouselPhotos.length; updateCarousel(); }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            map.dragging.enable();
            map.keyboard.enable();
        }

        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') { carouselIndex = (carouselIndex + 1) % carouselPhotos.length; updateCarousel(); }
            if (e.key === 'ArrowLeft') { carouselIndex = (carouselIndex - 1 + carouselPhotos.length) % carouselPhotos.length; updateCarousel(); }
        });

        // Legend interactivity
        document.querySelectorAll('.legend-row[data-category]').forEach(function(row) {
            row.addEventListener('click', function() {
                var cat = this.getAttribute('data-category');

                if (cat === 'Bog Walk') {
                    if (!bogPath) return;
                    if (map.hasLayer(bogPath)) {
                        map.removeLayer(bogPath);
                        if (bogGlow) map.removeLayer(bogGlow);
                        this.classList.add('dimmed');
                    } else {
                        bogGlow.addTo(map);
                        bogPath.addTo(map);
                        this.classList.remove('dimmed');
                    }
                    return;
                }

                var layer = categoryLayers[cat];
                if (!layer) return;

                if (map.hasLayer(layer)) {
                    map.removeLayer(layer);
                    this.classList.add('dimmed');
                } else {
                    layer.addTo(map);
                    this.classList.remove('dimmed');
                }
            });
        });
    </script>
</body>
</html>
