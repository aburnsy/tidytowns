site_name: TMB Tidy Towns
site_description: Two Mile Borris Tidy Towns - Community Projects
site_url: https://aburnsy.github.io/tidytowns/

theme:
  name: material
  palette:
    primary: green
    accent: light green
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - navigation.indexes
  icon:
    logo: material/leaf

plugins:
  - search
  - macros

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Projects:
    - Current Projects: projects/index.md
    - Completed: completed/index.md
  - Future: future/index.md
  - Village Map: map.md
  - Volunteer: volunteer.md
  - About: about.md
