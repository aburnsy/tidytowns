site_name: TMB Tidy Towns
site_description: Two Mile Borris Tidy Towns - Community Projects
site_url: https://aburnsy.github.io/tidytowns/

theme:
  name: material
  palette:
    primary: green
    accent: light green
  features:
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
  icon:
    logo: material/leaf

plugins:
  - search
  - macros

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Projects:
    - Current Projects: projects/index.md
    - Future: future/index.md
    - Completed: completed/index.md
  - Places: places/index.md
  - Heritage:
    - Overview: heritage/index.md
    - Prehistoric (5500 BC – AD 450): heritage/prehistoric.md
    - Early Medieval (AD 450 – 1169): heritage/early-medieval.md
    - Medieval (AD 1169 – 1550): heritage/medieval.md
    - Modern (1550 – today): heritage/modern.md
  - Village Map: map.md
  - Volunteer: volunteer.md
  - Guiding Principles: guiding-principles.md
  - About: about.md
